name: Build Fabric 1.21.4 Mod & Web Studio

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-fabric-mod:
    name: 🚀 Build Fabric 1.21.4 Mod (.jar)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: 🔨 Compile Fabric 1.21.4 Mod with Gradle Loom
        run: |
          if [ -d "fabric-mod" ] && [ -f "fabric-mod/build.gradle" ]; then
            cd fabric-mod
            gradle build --no-daemon
          elif [ -f "build.gradle" ]; then
            gradle build --no-daemon
          else
            echo "Error: build.gradle not found!"
            exit 1
          fi

      - name: 📦 Upload Mod JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuro-fabric-1.21.4-build
          path: |
            build/libs/*.jar
            fabric-mod/build/libs/*.jar
            !build/libs/*-sources.jar
            !fabric-mod/build/libs/*-sources.jar
          if-no-files-found: error

      - name: 🏷️ Publish GitHub Release with JAR
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            fabric-mod/build/libs/*.jar
          name: Neuro Client 1.21.4 Release
          generate_release_notes: true

  build-web:
    name: 🌐 Build Web ClickGUI Studio
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: ⚡ Build Web Assets
        run: npm run build
